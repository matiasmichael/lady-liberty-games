<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dress Lady Liberty! 👗</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #87CEEB 0%, #b8e4f7 60%, #1a6b3c 60%, #0d4a28 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    color: #fff;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
    font-size: 2.2rem;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .subtitle {
    color: #e0f7e9;
    font-size: 1rem;
    margin-bottom: 20px;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
  }
  .game-container {
    display: flex;
    gap: 30px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 900px;
  }
  .character-stage {
    background: linear-gradient(180deg, #c9eeff 0%, #a8d8ea 100%);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    border: 3px solid rgba(255,255,255,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 280px;
  }
  .character-stage svg {
    filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.3));
  }
  .stage-label {
    color: #2c7a4b;
    font-weight: bold;
    font-size: 1.1rem;
    margin-top: 10px;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 280px;
    max-width: 340px;
  }
  .control-group {
    background: rgba(255,255,255,0.92);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .control-group h3 {
    color: #2c7a4b;
    font-size: 0.95rem;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .option-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .opt-btn {
    background: #f0f9f4;
    border: 2px solid #b2dfdb;
    border-radius: 10px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.85rem;
    color: #2c7a4b;
    transition: all 0.2s;
    font-family: Georgia, serif;
  }
  .opt-btn:hover { background: #c8f0dc; border-color: #4caf88; }
  .opt-btn.active { background: #2c7a4b; color: #fff; border-color: #2c7a4b; }
  .color-swatch {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 3px solid #ccc;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: #222; transform: scale(1.2); }
  .share-btn {
    background: linear-gradient(135deg, #2c7a4b, #1a5c38);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 1rem;
    cursor: pointer;
    font-family: Georgia, serif;
    box-shadow: 0 4px 12px rgba(44,122,75,0.4);
    transition: transform 0.2s;
    width: 100%;
  }
  .share-btn:hover { transform: translateY(-2px); }
  .waves {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 80px;
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>
<body>

<h1>👗 Dress Lady Liberty! 🗽</h1>
<p class="subtitle">Style the Statue of Liberty your way ✨</p>

<div class="game-container">
  <div class="character-stage">
    <svg id="libertyChar" width="220" height="420" viewBox="0 0 220 420" xmlns="http://www.w3.org/2000/svg">
      <rect x="70" y="370" width="80" height="50" rx="4" fill="#b5a882"/>
      <rect x="80" y="360" width="60" height="15" rx="3" fill="#c8bb94"/>
      <g id="torchArm">
        <rect x="148" y="145" width="16" height="55" rx="8" fill="#c0a882" transform="rotate(-30 156 172)"/>
        <rect x="160" y="110" width="14" height="50" rx="7" fill="#c0a882" transform="rotate(-15 167 135)"/>
        <rect x="172" y="72" width="10" height="38" rx="5" fill="#8B6914"/>
        <ellipse cx="177" cy="62" rx="10" ry="16" fill="#FFB347" opacity="0.9"/>
        <ellipse cx="177" cy="58" rx="6" ry="11" fill="#FFD700"/>
        <ellipse cx="177" cy="55" rx="3" ry="7" fill="#fff7a0"/>
        <ellipse cx="177" cy="60" rx="14" ry="18" fill="#FFB347" opacity="0.25"/>
      </g>
      <g id="leftArm">
        <rect x="55" y="148" width="16" height="60" rx="8" fill="#c0a882" transform="rotate(15 63 178)"/>
        <rect x="38" y="200" width="30" height="22" rx="4" fill="#c8bb94" stroke="#8B6914" stroke-width="1.5"/>
        <text x="53" y="215" text-anchor="middle" font-size="6" fill="#6b4f12">JULY IV</text>
      </g>
      <g id="robe">
        <path id="robeMain" d="M78 185 Q60 200 52 270 Q45 330 50 370 L170 370 Q175 330 168 270 Q162 200 142 185 Z" fill="#5ba87a"/>
        <path d="M95 190 Q88 230 85 280 Q84 320 86 360" stroke="rgba(0,0,0,0.12)" stroke-width="2" fill="none"/>
        <path d="M110 192 Q108 240 107 290 Q107 330 108 365" stroke="rgba(0,0,0,0.1)" stroke-width="2" fill="none"/>
        <path d="M125 190 Q128 235 130 285 Q132 325 130 362" stroke="rgba(0,0,0,0.1)" stroke-width="2" fill="none"/>
        <path d="M88 190 Q82 225 80 270" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none"/>
        <path d="M52 355 Q90 348 110 350 Q135 348 168 355" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" fill="none"/>
        <rect x="75" y="210" width="70" height="10" rx="5" fill="rgba(0,0,0,0.12)"/>
      </g>
      <path d="M90 185 Q110 195 130 185 Q125 175 110 172 Q95 175 90 185Z" fill="#c0a882"/>
      <rect x="103" y="148" width="14" height="28" rx="7" fill="#d4b896"/>
      <ellipse cx="110" cy="130" rx="28" ry="34" fill="#d4b896"/>
      <ellipse cx="110" cy="135" rx="22" ry="26" fill="rgba(255,255,255,0.1)"/>
      <ellipse cx="100" cy="124" rx="4" ry="5" fill="white"/>
      <ellipse cx="120" cy="124" rx="4" ry="5" fill="white"/>
      <ellipse cx="100" cy="125" rx="2.5" ry="3" fill="#5c3d1e"/>
      <ellipse cx="120" cy="125" rx="2.5" ry="3" fill="#5c3d1e"/>
      <circle cx="101" cy="124" r="1" fill="white"/>
      <circle cx="121" cy="124" r="1" fill="white"/>
      <path d="M95 118 Q100 115 105 118" stroke="#7a5230" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M115 118 Q120 115 125 118" stroke="#7a5230" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M108 130 Q106 136 109 138 Q112 136 112 133" stroke="#b08060" stroke-width="1.2" fill="none"/>
      <path d="M101 143 Q110 150 119 143" stroke="#c07060" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="96" cy="140" rx="6" ry="4" fill="rgba(255,150,120,0.3)"/>
      <ellipse cx="124" cy="140" rx="6" ry="4" fill="rgba(255,150,120,0.3)"/>
      <path d="M82 118 Q84 100 90 95 Q95 92 98 98" stroke="#7a5230" stroke-width="3" fill="none"/>
      <path d="M138 118 Q136 100 130 95 Q125 92 122 98" stroke="#7a5230" stroke-width="3" fill="none"/>
      <g id="crown">
        <path d="M83 100 Q85 88 110 85 Q135 88 137 100 Z" fill="#C5A028"/>
        <rect x="83" y="98" width="54" height="8" rx="2" fill="#C5A028"/>
        <polygon points="88,100 85,72 94,96" fill="#D4AF37"/>
        <polygon points="100,98 98,68 107,95" fill="#D4AF37"/>
        <polygon points="110,97 110,65 119,95" fill="#D4AF37"/>
        <polygon points="120,98 122,68 130,96" fill="#D4AF37"/>
        <polygon points="130,100 135,72 138,98" fill="#D4AF37"/>
        <circle cx="88" cy="100" r="3" fill="#50fa7b"/>
        <circle cx="100" cy="98" r="3" fill="#ff79c6"/>
        <circle cx="110" cy="97" r="3" fill="#8be9fd"/>
        <circle cx="120" cy="98" r="3" fill="#ffb86c"/>
        <circle cx="130" cy="100" r="3" fill="#bd93f9"/>
        <path d="M87 100 Q110 90 133 100" stroke="rgba(255,255,200,0.5)" stroke-width="1.5" fill="none"/>
      </g>
      <g id="outfitLayer"></g>
      <g id="accessoryLayer"></g>
    </svg>
    <div class="stage-label">✨ Lady Liberty ✨</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <h3>🎨 Robe Color</h3>
      <div class="option-row" id="colorOptions">
        <div class="color-swatch active" style="background:#5ba87a" data-color="#5ba87a" title="Classic Green" onclick="setColor(this)"></div>
        <div class="color-swatch" style="background:#4a90d9" data-color="#4a90d9" title="Ocean Blue" onclick="setColor(this)"></div>
        <div class="color-swatch" style="background:#9b59b6" data-color="#9b59b6" title="Royal Purple" onclick="setColor(this)"></div>
        <div class="color-swatch" style="background:#e74c3c" data-color="#e74c3c" title="Liberty Red" onclick="setColor(this)"></div>
        <div class="color-swatch" style="background:#f39c12" data-color="#f39c12" title="Golden" onclick="setColor(this)"></div>
        <div class="color-swatch" style="background:#ec407a" data-color="#ec407a" title="Rose Pink" onclick="setColor(this)"></div>
        <div class="color-swatch" style="background:#00bcd4" data-color="#00bcd4" title="Aqua" onclick="setColor(this)"></div>
        <div class="color-swatch" style="background:#ff7043" data-color="#ff7043" title="Sunset" onclick="setColor(this)"></div>
      </div>
    </div>
    <div class="control-group">
      <h3>👑 Crown Style</h3>
      <div class="option-row" id="crownOptions">
        <button class="opt-btn active" onclick="setCrown(this,'classic')">Classic</button>
        <button class="opt-btn" onclick="setCrown(this,'tiara')">Tiara</button>
        <button class="opt-btn" onclick="setCrown(this,'flowers')">Floral</button>
        <button class="opt-btn" onclick="setCrown(this,'none')">None</button>
      </div>
    </div>
    <div class="control-group">
      <h3>👗 Outfit Style</h3>
      <div class="option-row" id="outfitOptions">
        <button class="opt-btn active" onclick="setOutfit(this,'classic')">Classic</button>
        <button class="opt-btn" onclick="setOutfit(this,'gown')">Ball Gown</button>
        <button class="opt-btn" onclick="setOutfit(this,'stars')">Star Spangled</button>
        <button class="opt-btn" onclick="setOutfit(this,'summer')">Summer</button>
      </div>
    </div>
    <div class="control-group">
      <h3>🎠 Accessory</h3>
      <div class="option-row" id="accessoryOptions">
        <button class="opt-btn active" onclick="setAccessory(this,'none')">None</button>
        <button class="opt-btn" onclick="setAccessory(this,'necklace')">Necklace</button>
        <button class="opt-btn" onclick="setAccessory(this,'bow')">Bow</button>
        <button class="opt-btn" onclick="setAccessory(this,'scarf')">Scarf</button>
      </div>
    </div>
    <button class="share-btn" onclick="alert('Looking gorgeous, Liberty! 🗽✨')">Show off your Liberty!</button>
  </div>
</div>

<svg class="waves" viewBox="0 0 1440 80" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a8acd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d5fa0" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <path fill="url(#waveGrad)">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M0,40 C360,80 1080,0 1440,40 L1440,80 L0,80 Z;
              M0,20 C360,60 1080,20 1440,60 L1440,80 L0,80 Z;
              M0,40 C360,80 1080,0 1440,40 L1440,80 L0,80 Z"/>
  </path>
</svg>

<script>
function setColor(el) {
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('robeMain').setAttribute('fill', el.dataset.color);
}
function setCrown(el, style) {
  document.querySelectorAll('#crownOptions .opt-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const crown = document.getElementById('crown');
  if (style === 'none') { crown.style.display = 'none'; }
  else if (style === 'classic') {
    crown.style.display = '';
    crown.innerHTML = `<path d="M83 100 Q85 88 110 85 Q135 88 137 100 Z" fill="#C5A028"/><rect x="83" y="98" width="54" height="8" rx="2" fill="#C5A028"/><polygon points="88,100 85,72 94,96" fill="#D4AF37"/><polygon points="100,98 98,68 107,95" fill="#D4AF37"/><polygon points="110,97 110,65 119,95" fill="#D4AF37"/><polygon points="120,98 122,68 130,96" fill="#D4AF37"/><polygon points="130,100 135,72 138,98" fill="#D4AF37"/><circle cx="88" cy="100" r="3" fill="#50fa7b"/><circle cx="100" cy="98" r="3" fill="#ff79c6"/><circle cx="110" cy="97" r="3" fill="#8be9fd"/><circle cx="120" cy="98" r="3" fill="#ffb86c"/><circle cx="130" cy="100" r="3" fill="#bd93f9"/>`;
  } else if (style === 'tiara') {
    crown.style.display = '';
    crown.innerHTML = `<path d="M83 104 Q110 92 137 104" stroke="#D4AF37" stroke-width="4" fill="none"/><circle cx="110" cy="92" r="5" fill="#D4AF37"/><circle cx="95" cy="97" r="3.5" fill="#D4AF37"/><circle cx="125" cy="97" r="3.5" fill="#D4AF37"/><circle cx="83" cy="103" r="2.5" fill="#D4AF37"/><circle cx="137" cy="103" r="2.5" fill="#D4AF37"/><circle cx="110" cy="92" r="3" fill="#8be9fd"/><circle cx="95" cy="97" r="2" fill="#ff79c6"/><circle cx="125" cy="97" r="2" fill="#50fa7b"/>`;
  } else if (style === 'flowers') {
    crown.style.display = '';
    crown.innerHTML = `<path d="M83 104 Q110 95 137 104" stroke="#7cb87a" stroke-width="3" fill="none"/><circle cx="93" cy="100" r="7" fill="#ff79c6" opacity="0.9"/><circle cx="110" cy="94" r="8" fill="#ff5e57" opacity="0.9"/><circle cx="127" cy="100" r="7" fill="#ffb86c" opacity="0.9"/><circle cx="93" cy="100" r="3" fill="#fff"/><circle cx="110" cy="94" r="3.5" fill="#fff"/><circle cx="127" cy="100" r="3" fill="#fff"/><circle cx="82" cy="104" r="5" fill="#bd93f9" opacity="0.8"/><circle cx="138" cy="104" r="5" fill="#50fa7b" opacity="0.8"/>`;
  }
}
function setOutfit(el, style) {
  document.querySelectorAll('#outfitOptions .opt-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const layer = document.getElementById('outfitLayer');
  if (style === 'classic') { layer.innerHTML = ''; }
  else if (style === 'gown') { layer.innerHTML = `<path d="M75 210 Q55 250 45 310 Q40 345 48 370 L172 370 Q180 345 175 310 Q165 250 145 210 Z" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/><path d="M80 215 Q75 260 73 310" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none"/><path d="M140 215 Q145 260 147 310" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none"/>`; }
  else if (style === 'stars') { layer.innerHTML = `<text x="82" y="230" font-size="14" fill="rgba(255,255,255,0.85)">&#9733;</text><text x="125" y="245" font-size="10" fill="rgba(255,255,255,0.7)">&#9733;</text><text x="95" y="270" font-size="12" fill="rgba(255,255,255,0.8)">&#9733;</text><text x="118" y="300" font-size="14" fill="rgba(255,255,255,0.75)">&#9733;</text><text x="78" y="315" font-size="10" fill="rgba(255,255,255,0.65)">&#9733;</text><rect x="52" y="255" width="116" height="5" rx="2" fill="rgba(220,50,50,0.35)"/><rect x="52" y="275" width="116" height="5" rx="2" fill="rgba(220,50,50,0.3)"/>`; }
  else if (style === 'summer') { layer.innerHTML = `<path d="M80 200 Q110 208 140 200 Q138 215 110 220 Q82 215 80 200Z" fill="rgba(255,200,100,0.6)" stroke="rgba(255,180,50,0.8)" stroke-width="1"/><circle cx="90" cy="225" r="4" fill="rgba(255,120,120,0.7)"/><circle cx="110" cy="220" r="4" fill="rgba(255,120,120,0.7)"/><circle cx="130" cy="225" r="4" fill="rgba(255,120,120,0.7)"/>`; }
}
function setAccessory(el, style) {
  document.querySelectorAll('#accessoryOptions .opt-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const layer = document.getElementById('accessoryLayer');
  if (style === 'none') { layer.innerHTML = ''; }
  else if (style === 'necklace') { layer.innerHTML = `<path d="M95 175 Q110 182 125 175" stroke="#D4AF37" stroke-width="2.5" fill="none"/><circle cx="103" cy="179" r="3" fill="#D4AF37"/><circle cx="110" cy="181" r="4" fill="#D4AF37"/><circle cx="117" cy="179" r="3" fill="#D4AF37"/><circle cx="110" cy="185" r="3" fill="#8be9fd"/>`; }
  else if (style === 'bow') { layer.innerHTML = `<path d="M95 178 Q102 170 110 178 Q118 170 125 178 Q118 186 110 178 Q102 186 95 178Z" fill="#ff79c6"/><circle cx="110" cy="178" r="4" fill="#ff5e8a"/>`; }
  else if (style === 'scarf') { layer.innerHTML = `<path d="M88 182 Q110 195 132 182 Q128 200 120 205 Q110 210 100 205 Q92 200 88 182Z" fill="#ff7043" opacity="0.85"/><path d="M120 195 Q125 220 118 240" stroke="#ff7043" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>`; }
}
</script>
</body>
</html>
